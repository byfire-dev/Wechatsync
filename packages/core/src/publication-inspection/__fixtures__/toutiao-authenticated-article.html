  <body>
    <article
      class="syl-article-base syl-page-article tt-article-content syl-device-pc"
    >
      <p>
        发布闭环的关键不是保存按钮返回成功，而是让草稿身份、平台账号、公开页面和后续归因能够被同一组可验证证据连接起来。
      </p>
      <p>
        管理页只负责给出平台实际返回的公开条目链接；核验器不会根据草稿编号猜测公开地址，也不会把不完整扫描解释成未发布。
      </p>
      <h2>公开访问与登录可见应分开记录</h2>
      <p>
        当匿名访问得到平台的不存在页面，而绑定账号登录后能读取结构完整的文章时，系统保留发布事实，同时把公网可访问性标记为平台阻断。
      </p>
    </article>
